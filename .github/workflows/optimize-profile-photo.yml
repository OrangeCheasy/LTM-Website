name: Optimize profile photo

on:
  push:
    branches:
      - feat/v3.00-profile-photo
    paths:
      - "public/IMG_1179.jpeg"
      - ".github/workflows/optimize-profile-photo.yml"

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install image optimizer
        run: npm install --no-save --package-lock=false sharp@0.34.4

      - name: Convert profile photo to AVIF
        run: |
          node <<'NODE'
          const fs = require("fs");
          const sharp = require("sharp");

          const input = "public/IMG_1179.jpeg";
          const output = "public/profile-photo.avif";

          (async () => {
            if (!fs.existsSync(input)) {
              console.log("Source image already processed; nothing to do.");
              return;
            }

            await sharp(input)
              .rotate()
              .resize({
                width: 512,
                height: 512,
                fit: "inside",
                withoutEnlargement: true,
              })
              .avif({
                quality: 68,
                effort: 6,
                chromaSubsampling: "4:2:0",
              })
              .toFile(output);

            const before = fs.statSync(input).size;
            const after = fs.statSync(output).size;
            console.log(`Optimized profile photo: ${before} bytes -> ${after} bytes`);

            fs.unlinkSync(input);

            const profilePath = "src/data/profile.ts";
            let profile = fs.readFileSync(profilePath, "utf8");
            profile = profile.replace(
              "  image: null,",
              '  image: { src: "/profile-photo.avif", alt: "Portrait of Liam Mo" },'
            );
            fs.writeFileSync(profilePath, profile);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit optimized asset
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize and add profile photo"
          git push origin HEAD:feat/v3.00-profile-photo
