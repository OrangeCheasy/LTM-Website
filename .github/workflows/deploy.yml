name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare private production bindings
        env:
          VISITOR_DB_NAME: ${{ secrets.CLOUDFLARE_VISITOR_DB_NAME }}
          VISITOR_DB_ID: ${{ secrets.CLOUDFLARE_VISITOR_DB_ID }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const databaseName = process.env.VISITOR_DB_NAME?.trim() ?? "";
          const databaseId = process.env.VISITOR_DB_ID?.trim() ?? "";

          if (Boolean(databaseName) !== Boolean(databaseId)) {
            throw new Error(
              "CLOUDFLARE_VISITOR_DB_NAME and CLOUDFLARE_VISITOR_DB_ID must either both be configured or both be omitted.",
            );
          }

          if (!databaseName) {
            console.log("VISITOR_DB secrets are not configured; deploying without the optional D1 binding.");
            process.exit(0);
          }

          const configPath = "wrangler.jsonc";
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          config.d1_databases = [
            {
              binding: "VISITOR_DB",
              database_name: databaseName,
              database_id: databaseId,
            },
          ];
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          console.log("Prepared private VISITOR_DB binding for this deployment.");
          NODE

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Generate Cloudflare types
        run: npm run cf-typegen

      - name: Build OpenNext worker
        run: npm run build:worker

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy OpenNext worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
