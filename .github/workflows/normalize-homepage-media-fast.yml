name: Normalize homepage media fast

on:
  push:
    branches:
      - feat/v3.00-homepage-media-organization-v2
    paths:
      - "public/**"
      - "src/data/profile.ts"
      - "src/components/OutsideTechSection.tsx"
      - ".github/workflows/normalize-homepage-media-fast.yml"

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install image optimizer
        run: npm install --no-save --package-lock=false sharp@0.34.4

      - name: Normalize homepage photos
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const sharp = require("sharp");

          sharp.cache(false);

          const gallery = [
            ["public/about/fish.webp", "public/homepage/outside-tech/photo-01.avif"],
            ["public/about/gym.webp", "public/homepage/outside-tech/photo-02.avif"],
            ["public/about/food.webp", "public/homepage/outside-tech/photo-03.avif"],
            ["public/IMG_3762.jpeg", "public/homepage/outside-tech/photo-04.avif"],
            ["public/IMG_4272.jpeg", "public/homepage/outside-tech/photo-05.avif"],
            ["public/IMG_5725.jpeg", "public/homepage/outside-tech/photo-06.avif"],
            ["public/IMG_7309.jpeg", "public/homepage/outside-tech/photo-07.avif"],
            ["public/IMG_8856.jpeg", "public/homepage/outside-tech/photo-08.avif"],
            ["public/IMG_8878.jpeg", "public/homepage/outside-tech/photo-09.avif"],
            ["public/IMG_9942.jpeg", "public/homepage/outside-tech/photo-10.avif"],
          ];

          const galleryPhotos = [
            {
              src: "/homepage/outside-tech/photo-01.avif",
              alt: "Liam smiling and holding a small fish he caught, with grassy hills and a blue sky behind him.",
            },
            {
              src: "/homepage/outside-tech/photo-02.avif",
              alt: "Liam at the gym on a bench press with a training partner.",
            },
            {
              src: "/homepage/outside-tech/photo-03.avif",
              alt: "Liam adding fresh herbs to a bowl of pho at a restaurant.",
            },
            { src: "/homepage/outside-tech/photo-04.avif", alt: "A moment from Liam's life outside technology." },
            { src: "/homepage/outside-tech/photo-05.avif", alt: "A moment from Liam's life outside technology." },
            { src: "/homepage/outside-tech/photo-06.avif", alt: "A moment from Liam's life outside technology." },
            { src: "/homepage/outside-tech/photo-07.avif", alt: "A moment from Liam's life outside technology." },
            { src: "/homepage/outside-tech/photo-08.avif", alt: "A moment from Liam's life outside technology." },
            { src: "/homepage/outside-tech/photo-09.avif", alt: "A moment from Liam's life outside technology." },
            { src: "/homepage/outside-tech/photo-10.avif", alt: "A moment from Liam's life outside technology." },
          ];

          (async () => {
            fs.mkdirSync("public/homepage/profile", { recursive: true });
            fs.mkdirSync("public/homepage/outside-tech", { recursive: true });

            for (const [input, output] of gallery) {
              if (!fs.existsSync(input)) {
                if (fs.existsSync(output)) continue;
                throw new Error(`Missing expected gallery image: ${input}`);
              }

              const metadata = await sharp(input).metadata();

              await sharp(input)
                .rotate()
                .resize({
                  width: 1600,
                  height: 1600,
                  fit: "inside",
                  withoutEnlargement: true,
                })
                .avif({
                  quality: 65,
                  effort: 3,
                  chromaSubsampling: "4:2:0",
                })
                .toFile(output);

              const before = fs.statSync(input).size;
              const after = fs.statSync(output).size;
              console.log(
                `${path.basename(input)}: ${metadata.width}x${metadata.height}, ${before} bytes -> ${after} bytes (${path.basename(output)})`
              );

              fs.unlinkSync(input);
            }

            const oldProfile = "public/profile-photo.avif";
            const newProfile = "public/homepage/profile/profile-photo.avif";
            if (fs.existsSync(oldProfile)) {
              fs.copyFileSync(oldProfile, newProfile);
              fs.unlinkSync(oldProfile);
              console.log(`Moved profile photo -> ${newProfile}`);
            }

            const profilePath = "src/data/profile.ts";
            let profile = fs.readFileSync(profilePath, "utf8");
            profile = profile.replace(
              '"/profile-photo.avif"',
              '"/homepage/profile/profile-photo.avif"'
            );
            fs.writeFileSync(profilePath, profile);

            const galleryPath = "src/components/OutsideTechSection.tsx";
            let component = fs.readFileSync(galleryPath, "utf8");
            const start = component.indexOf("const outsideTechPhotos = [");
            const end = component.indexOf("\n];", start);
            if (start === -1 || end === -1) {
              throw new Error("Could not locate outsideTechPhotos array.");
            }

            const entries = galleryPhotos.map(({ src, alt }) =>
              `  {\n    src: ${JSON.stringify(src)},\n    alt: ${JSON.stringify(alt)},\n  },`
            );
            const galleryBlock = "const outsideTechPhotos = [\n" + entries.join("\n") + "\n];";

            component = component.slice(0, start) + galleryBlock + component.slice(end + 3);
            fs.writeFileSync(galleryPath, component);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit normalized homepage media
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize homepage photo assets"
          git push origin HEAD:feat/v3.00-homepage-media-organization-v2
