name: CI

on:
  pull_request:
    branches:
      - main
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, audit, OpenNext build, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Generate Cloudflare types
        run: npm run cf-typegen

      # Validate the same OpenNext worker artifact production deploys.
      # This generates .open-next/worker.js but does not upload or deploy it.
      - name: Build OpenNext worker
        run: npm run build:worker

      # Run after the build because Next.js generates route types during build.
      - name: Typecheck
        run: npx tsc --noEmit
