name: CI

on:
  pull_request:
    branches:
      - main
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, OpenNext build, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Cloudflare types
        run: npm run cf-typegen

      # Validate the same OpenNext worker artifact Cloudflare deploys.
      # This generates .open-next/worker.js but does not upload or deploy it.
      - name: Build OpenNext worker
        run: npm run build:worker

      # Run after the build because Next.js generates route types during build.
      - name: Typecheck
        run: npx tsc --noEmit
