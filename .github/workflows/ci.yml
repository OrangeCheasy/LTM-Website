name: CI

on:
  pull_request:
    branches:
      - main
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, audit, OpenNext build, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      # One-time lockfile regeneration for this security patch branch only.
      - name: Regenerate patched lockfile
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/main-github-deploy-security-hardening'
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit patched lockfile
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/main-github-deploy-security-hardening'
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for security dependency patches"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Generate Cloudflare types
        run: npm run cf-typegen

      # Validate the same OpenNext worker artifact production deploys.
      # This generates .open-next/worker.js but does not upload or deploy it.
      - name: Build OpenNext worker
        run: npm run build:worker

      # Run after the build because Next.js generates route types during build.
      - name: Typecheck
        run: npx tsc --noEmit
